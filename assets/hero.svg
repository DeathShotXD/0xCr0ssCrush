<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-labelledby="xtitle xdesc">
  <title id="xtitle">0xCr0ssCrush - two signed drivers, one kernel primitive</title>
  <desc id="xdesc">Dark cyan and magenta banner with a crossed-blade containment ring and a driver surface panel for DCRCVDrv.sys and Alinubx.sys.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset=".46" stop-color="#090b12"/>
      <stop offset="1" stop-color="#150711"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx=".17" cy=".18" r=".64">
      <stop offset="0" stop-color="#2ad9ff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#2ad9ff" stop-opacity=".045"/>
      <stop offset="1" stop-color="#2ad9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx=".93" cy=".12" r=".7">
      <stop offset="0" stop-color="#ff2f9c" stop-opacity=".23"/>
      <stop offset=".55" stop-color="#ff2f9c" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ff2f9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f6e400" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#ff2f9c" stop-opacity=".07"/>
      <stop offset="1" stop-color="#2ad9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9fdff"/>
      <stop offset=".42" stop-color="#b9f6ff"/>
      <stop offset="1" stop-color="#2ad9ff"/>
    </linearGradient>
    <linearGradient id="wordPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2f9c"/>
      <stop offset=".58" stop-color="#ff5cb5"/>
      <stop offset="1" stop-color="#ffc0de"/>
    </linearGradient>
    <linearGradient id="bladeCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ad9ff" stop-opacity=".3"/>
      <stop offset=".4" stop-color="#2ad9ff"/>
      <stop offset="1" stop-color="#effeff"/>
    </linearGradient>
    <linearGradient id="bladePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2f9c" stop-opacity=".3"/>
      <stop offset=".4" stop-color="#ff2f9c"/>
      <stop offset="1" stop-color="#ffc0de"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ad9ff" stop-opacity="0"/>
      <stop offset=".26" stop-color="#2ad9ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#f6e400" stop-opacity=".35"/>
      <stop offset=".8" stop-color="#ff2f9c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff2f9c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2ad9ff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r=".9" fill="#f6f0e2" fill-opacity=".045"/>
    </pattern>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="1" fill="#ffffff" fill-opacity=".017"/>
    </pattern>
    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 3.3px; fill: #2ad9ff; }
      .micro { font-size: 9.5px; letter-spacing: 1.8px; fill: #708294; }
      .title { font-size: 68px; font-weight: 800; letter-spacing: -2.6px; }
      .subtitle { font-size: 15px; font-weight: 800; letter-spacing: 2.4px; fill: #f6f0e2; }
      .lede { font-size: 13.5px; fill: #8fa0b3; }
      .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 1.15px; }
      .panel-h { font-size: 9px; font-weight: 700; letter-spacing: 2.1px; }
      .panel-row { font-size: 10.5px; font-weight: 700; letter-spacing: .2px; fill: #dbe7ee; }
      .panel-out { font-size: 8.5px; font-weight: 700; letter-spacing: .9px; }
      .tag { font-size: 8.5px; font-weight: 700; letter-spacing: 1.7px; }
      .spin { animation: spin 34s linear infinite; transform-origin: 986px 174px; transform-box: view-box; }
      .spin-rev { animation: spinrev 24s linear infinite; transform-origin: 986px 174px; transform-box: view-box; }
      .core { animation: core 4.4s ease-in-out infinite; transform-origin: 986px 174px; transform-box: view-box; }
      .blade { animation: blade 5.4s ease-in-out infinite; }
      .blade-rev { animation: blade 5.4s ease-in-out infinite; animation-delay: -2.7s; }
      .spark { animation: spark 3.2s ease-in-out infinite; transform-origin: 986px 174px; transform-box: view-box; }
      .twinkle { animation: twinkle 5s ease-in-out infinite; }
      .sweep { animation: sweep 8.4s ease-in-out infinite; }
      .glitch { animation: glitch 7.2s steps(1) infinite; }
      .blink { animation: blink 1.15s steps(1) infinite; }
      .flow { stroke-dasharray: 5 7; animation: flow 1.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinrev { to { transform: rotate(-360deg); } }
      @keyframes core { 0%,100% { opacity:.86; transform: scale(.99); } 50% { opacity:1; transform: scale(1.025); } }
      @keyframes blade { 0%,100% { opacity:.86; } 48% { opacity:1; } 52% { opacity:.62; } 56% { opacity:1; } }
      @keyframes spark { 0%,100% { opacity:.65; transform: scale(.9) rotate(0deg); } 50% { opacity:1; transform: scale(1.12) rotate(8deg); } }
      @keyframes twinkle { 0%,100% { opacity:.08; } 50% { opacity:.58; } }
      @keyframes sweep { 0% { transform: translateY(-140px); opacity:0; } 12% { opacity:.5; } 78% { opacity:.18; } 100% { transform: translateY(240px); opacity:0; } }
      @keyframes glitch { 0%,90%,100% { transform: translate(0,0); } 91% { transform: translate(2px,0); } 92% { transform: translate(-2px,1px); } 93% { transform: translate(1px,-1px); } }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:.2; } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @media (prefers-reduced-motion: reduce) { .spin,.spin-rev,.core,.blade,.blade-rev,.spark,.twinkle,.sweep,.glitch,.blink,.flow { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <rect width="1280" height="460" fill="url(#dots)" opacity=".8"/>
  <rect width="1280" height="460" fill="url(#scan)"/>
  <rect width="1280" height="460" fill="url(#cyanGlow)"/>
  <rect width="1280" height="460" fill="url(#magentaGlow)"/>

  <g stroke="#ff2f9c" stroke-opacity=".12" stroke-width="1">
    <path d="M-20 420 L170 230"/><path d="M30 454 L220 264"/><path d="M80 488 L270 298"/>
  </g>
  <g stroke="#2ad9ff" stroke-opacity=".1" stroke-width="1">
    <path d="M-10 330 L90 230"/><path d="M-30 380 L70 280"/>
  </g>

  <g fill="none" stroke="#f6f0e2" stroke-opacity=".3" stroke-width="1.2">
    <path d="M26 66 V26 H66"/>
    <path d="M1214 26 H1254 V66"/>
    <path d="M26 394 V434 H66"/>
    <path d="M1214 434 H1254 V394"/>
  </g>

  <!-- identity -->
  <g transform="translate(64 52)">
    <path d="M8 10 L15 3 L22 9 L28 3 L35 10 L32 34 Q21 42 10 34 Z" fill="#07080e" stroke="#2ad9ff" stroke-opacity=".65" stroke-width="1.3"/>
    <path d="M13 19 L19 17 L18 22 Z" fill="#2ad9ff"/>
    <path d="M25 19 L31 17 L30 22 Z" fill="#2ad9ff"/>
    <path d="M18 28 L24 26 L27 30 L21 32 Z" fill="#ff2f9c" fill-opacity=".85"/>
    <path d="M35 12 L45 6 L42 16" fill="none" stroke="#ff2f9c" stroke-width="1.4" stroke-opacity=".8"/>
    <text x="52" y="15" class="mono eyebrow">0XCR0SSCRUSH</text>
    <text x="52" y="31" class="mono micro">WINDOWS BYOVD · CRUCIFERRA · RING 0</text>
  </g>

  <g class="glitch">
    <text x="66" y="176" class="sans title" opacity=".3" fill="#ff2f9c" stroke="none">0xCr0ssCrush</text>
  </g>
  <text x="64" y="174" class="sans title"><tspan fill="url(#wordCyan)">0x</tspan><tspan fill="#f6f0e2">Cr0ss</tspan><tspan fill="url(#wordPink)">Crush</tspan></text>
  <rect x="64" y="186" width="204" height="2" fill="#ff2f9c" opacity=".6"/>
  <rect x="276" y="184" width="96" height="1" fill="#2ad9ff" opacity=".45"/>
  <rect x="380" y="183" width="22" height="4" fill="#f6e400" opacity=".7" transform="skewX(-28)"/>

  <text x="66" y="218" class="mono subtitle">TWO DRIVERS. ONE PRIMITIVE.</text>
  <text x="66" y="246" class="sans lede">DCRCVDrv.sys and Alinubx.sys: signed, abused in the wild, absent from the blocklist snapshot.</text>

  <g transform="translate(66 274)">
    <rect x="0" y="0" width="166" height="30" rx="15" fill="#2ad9ff" fill-opacity=".06" stroke="#2ad9ff" stroke-opacity=".34"/>
    <circle cx="16" cy="15" r="3.2" fill="#2ad9ff"/>
    <text x="28" y="19" class="mono chip" fill="#b9f6ff">SIGNED / ABUSED</text>

    <rect x="178" y="0" width="190" height="30" rx="15" fill="#ff2f9c" fill-opacity=".06" stroke="#ff2f9c" stroke-opacity=".38"/>
    <circle cx="194" cy="15" r="3.2" fill="#ff2f9c"/>
    <text x="206" y="19" class="mono chip" fill="#ffc0de">PROCESS_TERMINATION</text>

    <rect x="380" y="0" width="174" height="30" rx="15" fill="#f6e400" fill-opacity=".05" stroke="#f6e400" stroke-opacity=".3"/>
    <circle cx="396" cy="15" r="3.2" fill="#f6e400"/>
    <text x="408" y="19" class="mono chip" fill="#fbf59b">BLOCKLIST ABSENT</text>
  </g>

  <text x="66" y="352" class="mono micro" fill="#8fa0b3" opacity=".9">PRIMITIVE: PROCESS_TERMINATION · PPL: DENIED · FALLBACK: ON</text>
  <text x="64" y="410" class="mono micro">GITHUB.COM/DEATHSHOTXD/0XCR0SSCRUSH</text>

  <!-- crossed blade core -->
  <g>
    <circle cx="986" cy="174" r="196" fill="url(#coreGlow)"/>
    <circle cx="986" cy="174" r="164" fill="none" stroke="#2ad9ff" stroke-opacity=".09" stroke-dasharray="2 12"/>
    <g opacity=".9">
      <path d="M986 18 V32 M986 316 V330 M830 174 H844 M1128 174 H1142" stroke="#f6f0e2" stroke-opacity=".3" stroke-width="1"/>
      <circle cx="986" cy="174" r="146" fill="none" stroke="#f6f0e2" stroke-opacity=".06"/>
    </g>

    <g class="spin">
      <path d="M986 44 A130 130 0 0 1 1104 110" fill="none" stroke="#2ad9ff" stroke-width="3" stroke-linecap="round" filter="url(#lineGlow)"/>
      <path d="M1110 124 A130 130 0 0 1 1096 232" fill="none" stroke="#ff2f9c" stroke-width="3" stroke-linecap="round" filter="url(#lineGlow)"/>
      <path d="M1078 250 A130 130 0 0 1 950 302" fill="none" stroke="#f6e400" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
      <path d="M932 301 A130 130 0 0 1 858 222" fill="none" stroke="#2ad9ff" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
    </g>

    <g class="spin-rev">
      <circle cx="986" cy="174" r="130" fill="none" stroke="#f6f0e2" stroke-opacity=".13" stroke-width=".9" stroke-dasharray="16 10"/>
      <circle cx="986" cy="174" r="114" fill="none" stroke="#ff2f9c" stroke-opacity=".1" stroke-width=".8" stroke-dasharray="1 7"/>
    </g>

    <!-- crossed blades -->
    <g class="core">
      <g transform="rotate(-38 986 174)" class="blade">
        <path d="M866 174 L926 166 L1046 162 L1098 170 L1110 174 L1098 178 L1046 186 L926 182 Z"
              fill="#2ad9ff" fill-opacity=".12" stroke="url(#bladeCyan)" stroke-width="1.8" filter="url(#lineGlow)"/>
        <path d="M900 174 L1040 168 L1084 172 L1040 180 L900 174 Z" fill="#2ad9ff" fill-opacity=".3"/>
        <rect x="850" y="165" width="24" height="18" rx="3" fill="#2ad9ff" fill-opacity=".08" stroke="#2ad9ff" stroke-opacity=".55"/>
        <rect x="832" y="170" width="18" height="8" rx="3" fill="#2ad9ff" fill-opacity=".16" stroke="#2ad9ff" stroke-opacity=".3"/>
        <circle cx="828" cy="174" r="3" fill="#2ad9ff"/>
        <path d="M868 174 H1088" stroke="#b9f6ff" stroke-opacity=".55" stroke-width=".7" class="flow"/>
      </g>
      <g transform="rotate(38 986 174)" class="blade-rev">
        <path d="M866 174 L926 166 L1046 162 L1098 170 L1110 174 L1098 178 L1046 186 L926 182 Z"
              fill="#ff2f9c" fill-opacity=".12" stroke="url(#bladePink)" stroke-width="1.8" filter="url(#lineGlow)"/>
        <path d="M900 174 L1040 168 L1084 172 L1040 180 L900 174 Z" fill="#ff2f9c" fill-opacity=".3"/>
        <rect x="850" y="165" width="24" height="18" rx="3" fill="#ff2f9c" fill-opacity=".08" stroke="#ff2f9c" stroke-opacity=".55"/>
        <rect x="832" y="170" width="18" height="8" rx="3" fill="#ff2f9c" fill-opacity=".16" stroke="#ff2f9c" stroke-opacity=".3"/>
        <circle cx="828" cy="174" r="3" fill="#ff2f9c"/>
        <path d="M868 174 H1088" stroke="#ffc0de" stroke-opacity=".55" stroke-width=".7" class="flow"/>
      </g>

      <!-- impact spark -->
      <g class="spark">
        <path d="M986 138 L992 162 L1018 174 L992 186 L986 210 L980 186 L954 174 L980 162 Z"
              fill="#f6e400" fill-opacity=".16" stroke="#f6e400" stroke-opacity=".8" stroke-width="1.1" filter="url(#lineGlow)"/>
        <path d="M986 152 L989 167 L1004 174 L989 181 L986 196 L983 181 L968 174 L983 167 Z" fill="#f6e400" fill-opacity=".65"/>
        <circle cx="986" cy="174" r="4.4" fill="#fffbd0"/>
      </g>
    </g>

    <g class="mono tag">
      <text x="835" y="292" text-anchor="end" fill="#2ad9ff" opacity=".82">DCRCVDRV</text>
      <text x="1160" y="236" text-anchor="start" fill="#ff2f9c" opacity=".82">ALINUBX</text>
      <text x="1168" y="36" text-anchor="end" fill="#ff2f9c" opacity=".65">RING 0 / KERNEL MODE</text>
      <text x="804" y="36" fill="#2ad9ff" opacity=".7">SIGNED · VULNERABLE · ABUSED</text>
    </g>

    <!-- fallback arc -->
    <path d="M864 278 C900 322 1040 330 1102 286" fill="none" stroke="#f6e400" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 5" class="flow"/>
    <path d="M1096 280 L1104 286 L1094 290" fill="none" stroke="#f6e400" stroke-opacity=".65" stroke-width="1.1"/>
    <text x="1112" y="294" class="mono micro" fill="#f6e400" opacity=".7">FALLBACK PATH</text>

    <g class="sweep">
      <rect x="830" y="120" width="312" height="18" fill="url(#rail)" opacity=".16"/>
    </g>
  </g>

  <!-- driver surface panel -->
  <g transform="translate(752 344)">
    <rect x="0" y="0" width="466" height="82" rx="12" fill="#080b12" fill-opacity=".94" stroke="#2ad9ff" stroke-opacity=".22"/>
    <rect x="0" y="0" width="466" height="82" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    <path d="M0 28 H466" stroke="#f6f0e2" stroke-opacity=".07"/>
    <text x="16" y="18" class="mono panel-h" fill="#2ad9ff" opacity=".85">DRIVER SURFACE</text>
    <text x="450" y="18" text-anchor="end" class="mono panel-h" fill="#f6e400" opacity=".8">FALLBACK: ON</text>

    <circle cx="18" cy="45" r="3" fill="#2ad9ff"/>
    <text x="30" y="49" class="mono panel-row">DCRCVDrv.sys</text>
    <text x="450" y="49" text-anchor="end" class="mono panel-out" fill="#b9f6ff" opacity=".8">IOCTL 0x2205C0 · PID</text>

    <circle cx="18" cy="68" r="3" fill="#ff2f9c"/>
    <text x="30" y="72" class="mono panel-row">Alinubx.sys</text>
    <text x="450" y="72" text-anchor="end" class="mono panel-out" fill="#ffc0de" opacity=".8">IOCTL 0x222024 · PID+STATUS</text>
  </g>

  <g fill="none" stroke="#2ad9ff" stroke-opacity=".22" stroke-width="1">
    <path d="M752 344 h-26"/>
    <path d="M1218 426 h26"/>
  </g>
</svg>
