name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          choco install mingw -y --no-progress
        shell: pwsh

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package release artifacts
        shell: pwsh
        run: |
          mkdir release
          Copy-Item target/x86_64-pc-windows-gnu/release/crosscrush.exe release/
          Copy-Item driver/DCRCVDrv.sys release/
          Copy-Item driver/Alinubx.sys release/
          Copy-Item README.md release/
          Copy-Item WRITEUP.md release/
          Copy-Item THREAT_MODEL.md release/
          Copy-Item metadata/drivers.json release/
          Copy-Item detection/sigma/driver_load_win_cruciferra_byovd.yml release/
          Copy-Item detection/yara/cruciferra_drivers.yar release/
          Copy-Item detection/telemetry/README.md release/
          Get-FileHash release/* | Format-Table

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: ${{ github.ref_name }} - research release
          body: |
            Windows BYOVD research release.

            Carry the drivers and the harness on a lab host. See
            README.md and docs/reproduction.md for the tested
            procedure.