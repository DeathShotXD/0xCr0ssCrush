name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        target: [x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MinGW toolchain
        run: |
          rustup target add x86_64-pc-windows-gnu
          choco install mingw -y --no-progress
        shell: pwsh

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify driver metadata registry
        run: python3 scripts/validate_metadata.py

      - name: Validate JSON documents
        run: |
          python3 -m json.tool metadata/drivers.json > /dev/null
          python3 -m json.tool metadata/samples.json > /dev/null

      - name: Validate YAML and YARA syntax
        run: |
          python3 -c "import yaml,sys; [yaml.safe_load(open(f)) for f in ['detection/sigma/driver_load_win_cruciferra_byovd.yml']]" || true

      - name: Documentation integrity
        run: |
          test -f README.md
          test -f WRITEUP.md
          test -f THREAT_MODEL.md
          git diff --check